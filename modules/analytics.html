<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Análisis Operativo
    </title>
    <link rel="icon" type="image/png" href="../assets/img/logo.png">

    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- ICONOS -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../assets/css/style.css?v=20260702-1">

</head>

<body class="dashboard-body">

    <div id="sidebar-container"></div>

    <!-- MAIN -->

    <div class="main-content">

        <div class="topbar">

            <h2>
                Motor de Análisis Operativo
            </h2>

            <div class="user-box">
                Mesa de Control
            </div>

        </div>

        <!-- KPI -->

        <div class="row g-4 mt-2">

            <div class="col-md-3">

                <div class="dashboard-card">

                    <h5>Productos OK</h5>

                    <h2 id="okCount">0</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="dashboard-card warning">

                    <h5>Exceso Físico</h5>

                    <h2 id="excesoCount">0</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="dashboard-card danger">

                    <h5>Diferencias Negativas</h5>

                    <h2 id="faltanteCount">0</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="dashboard-card success">

                    <h5>Exactitud</h5>

                    <h2 id="accuracy">0%</h2>

                </div>

            </div>

        </div>

        <!-- TABLA -->

        <div class="table-section mt-5">

            <div class="table-header">

                <h4>
                    Diferencias Detectadas
                </h4>

            </div>

            <table class="table table-dark table-hover">

                <thead>

                    <tr>

                        <th>UPC</th>

                        <th>Descripción</th>

                        <th>Sistema</th>

                        <th>Físico</th>

                        <th>Diferencia</th>

                        <th>Estado</th>

                        <th>Recomendación</th>

                    </tr>

                </thead>

                <tbody id="analyticsBody">

                </tbody>

            </table>

        </div>

    </div>

    <!-- JS -->

    <script src="../assets/js/analytics.js?v=20260702-1"></script>
    <script src="../assets/js/sidebar.js?v=20260702-1"></script>

</body>

</html>
