<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Reportes - SEYL_KALAN
    </title>
    <link rel="icon" type="image/png" href="../assets/img/logo.png">
    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Icons -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body class="dashboard-body">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="sidebar-logo">

            <i class="fa-solid fa-boxes-stacked"></i>

            <span>SEYL_KALAN</span>

        </div>

        <ul>

            <li onclick="window.location.href='dashboard.html'">

                <i class="fa-solid fa-chart-line"></i>

                Dashboard

            </li>

            <li onclick="window.location.href='inventory.html'">

                <i class="fa-solid fa-file-import"></i>

                Carga TXT/CSV

            </li>

            <li onclick="window.location.href='locations.html'">

                <i class="fa-solid fa-location-dot"></i>

                Consulta de Inventario

            </li>

            <li onclick="window.location.href='scanner.html'">

                <i class="fa-solid fa-barcode"></i>

                Barrido Físico

            </li>

            <li onclick="window.location.href='analytics.html'">

                <i class="fa-solid fa-magnifying-glass-chart"></i>

                Análisis

            </li>

            <li onclick="window.location.href='progress.html'">

                <i class="fa-solid fa-list-check"></i>

                Control Operativo

            </li>

            <li class="active">

                <i class="fa-solid fa-file-export"></i>

                Reportes

            </li>

            <li onclick="window.location.href='reports.html'">

                <i class="fa-solid fa-file-export"></i>
            
                Reportes
            
            </li>

            <li onclick="window.location.href='heatmap.html'">

                <i class="fa-solid fa-fire"></i>
            
                Heatmap
            
            </li>

        </ul>

    </div>

    <!-- MAIN -->

    <div class="main-content">

        <div class="topbar">

            <h2>
                Exportación de Reportes
            </h2>

            <div class="user-box">
                Auditoría Inventario
            </div>

        </div>

        <!-- BOTONES -->

        <div class="row mt-5 g-4">

            <!-- EXCEL -->
        
            <div class="col-lg-4 col-md-6">
        
                <div class="dashboard-card text-center h-100">
        
                    <i class="fa-solid fa-file-excel fa-3x mb-4"></i>
        
                    <h4 class="mb-4">
                        Exportar Excel
                    </h4>
        
                    <button
                        class="btn btn-success"
                        onclick="exportExcel()">
        
                        Descargar XLS
        
                    </button>
        
                </div>
        
            </div>
        
            <!-- TXT -->
        
            <div class="col-lg-4 col-md-6">
        
                <div class="dashboard-card text-center h-100">
        
                    <i class="fa-solid fa-file-lines fa-3x mb-4"></i>
        
                    <h4 class="mb-4">
                        Exportar TXT
                    </h4>
        
                    <button
                        class="btn btn-warning"
                        onclick="exportTXT()">
        
                        Descargar TXT
        
                    </button>
        
                </div>
        
            </div>
        
            <!-- AVANCE -->
        
            <div class="col-lg-4 col-md-6">
        
                <div class="dashboard-card text-center h-100">
        
                    <i class="fa-solid fa-list-check fa-3x mb-4"></i>
        
                    <h4 class="mb-4">
                        Reporte Avance
                    </h4>
        
                    <button
                        class="btn btn-primary"
                        onclick="exportProgressExcel()">
        
                        Descargar Avance XLS
        
                    </button>
        
                </div>
        
            </div>
        
        </div>

    </div>

    <!-- SheetJS -->

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <!-- JS -->

    <script src="../assets/js/reports.js"></script>

</body>

</html>
