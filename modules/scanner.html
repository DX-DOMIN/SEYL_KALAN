<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barrido Físico - SEYL_KALAN</title>
    <link rel="icon" type="image/png" href="../assets/img/logo.png">
    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Icons -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body class="dashboard-body">

    <!-- SIDEBAR -->

    <!-- SIDEBAR -->

<div class="sidebar">

    <div class="sidebar-logo">
        <i class="fa-solid fa-boxes-stacked"></i>
        <span>SEYL_KALAN</span>
    </div>

    <ul>

        <li onclick="window.location.href='dashboard.html'">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </li>

        <li onclick="window.location.href='inventory.html'">
            <i class="fa-solid fa-file-import"></i>
            Carga TXT/CSV
        </li>

        <li onclick="window.location.href='locations.html'">
            <i class="fa-solid fa-location-dot"></i>
            Consulta de Inventario
        </li>

        <li class="active">
            <i class="fa-solid fa-barcode"></i>
            Barrido Físico
        </li>

        <li onclick="window.location.href='validation.html'">

            <i class="fa-solid fa-clipboard-check"></i>
            Validación Operativa
        
        </li>

        <li onclick="window.location.href='analytics.html'">
            <i class="fa-solid fa-magnifying-glass-chart"></i>
            Análisis
        </li>

        <li>
            <i class="fa-solid fa-file-export"></i>
            Reportes
        </li>

        <li onclick="window.location.href='reports.html'">

            <i class="fa-solid fa-file-export"></i>
        
            Reportes
        
        </li>

        <li onclick="window.location.href='heatmap.html'">

            <i class="fa-solid fa-fire"></i>
        
            Heatmap
        
        </li>

    </ul>

</div>

    <!-- MAIN -->

    <div class="main-content">

        <div class="topbar">

            <h2>
                Barrido Físico Operativo
            </h2>

            <div class="user-box">
                Inventario Físico
            </div>

        </div>

        <!-- SELECT LOCATION -->

        <div class="scanner-card mt-4">

            <div class="row g-4">

                <div class="col-md-4">

                    <label>
                        Ubicación
                    </label>

                    <input
                        type="text"
                        id="locationInput"
                        class="form-control custom-input"
                        placeholder="Ejemplo: A-01-01">

                </div>

                <div class="col-md-8">

                    <label>
                        Escaneo UPC
                    </label>

                    <input
                        type="text"
                        id="scannerInput"
                        class="form-control custom-input"
                        placeholder="Escanear UPC"
                        autofocus>
                        <div class="massive-capture mt-3">

                            <label class="form-label">
                                Cantidad Capturada
                            </label>
                        
                            <input
                                type="number"
                                id="qtyInput"
                                class="form-control custom-input"
                                value="1"
                                min="1">
                        
                        </div>

                </div>

            </div>

        </div>

        <!-- TABLE -->

        <div class="table-section mt-5">

            <div class="table-header">

                <h4>
                    Conteo Físico
                </h4>

            </div>

            <table class="table table-dark table-hover">

                <thead>

                    <tr>

                        <th>Ubicación</th>
                        <th>UPC</th>
                        <th>Descripción</th>
                        <th>Sistema</th>
                        <th>Físico</th>
                        <th>Diferencia</th>
                        <th>Estado</th>

                    </tr>

                </thead>

                <tbody id="scannerTableBody">

                </tbody>

            </table>

        </div>

    </div>

    <script src="../assets/js/database.js"></script>
    <script src="../assets/js/scanner.js"></script>

</body>

</html>
